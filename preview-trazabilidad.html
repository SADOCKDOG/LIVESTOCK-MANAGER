<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Panel de Validacion Visual - Trazabilidad Porcina (RD 787/2023)</title>
  <link rel="stylesheet" href="css/design-tokens.css" />
  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #18181b;
      --border-subtle: #27272a;
      --c-txt-main: #f4f4f5;
      --c-txt-muted: #a1a1aa;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      padding-bottom: env(safe-area-inset-bottom, 24px);
      background-color: var(--bg-base);
      color: var(--c-txt-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }
    .top-nav {
      max-width: 1100px;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
    }
    .top-nav a {
      color: #60a5fa;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .top-nav a:hover {
      text-decoration: underline;
    }
    .badge-dev {
      background: #3b82f6;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <div>
      <span class="badge-dev">Host de Desarrollo Local</span>
      <span style="margin-left: 10px; font-size: 13px; color: var(--c-txt-muted);">Livestock Manager · Validacion Visual</span>
    </div>
    <div>
      <a href="/index.html">Ir a Aplicacion Principal</a>
    </div>
  </div>

  <main id="app-content"></main>

  <!-- Dependencias de Dominio y Vista -->
  <script src="js/services/porcine-traceability.js"></script>
  <script src="js/trazabilidad.js"></script>
  <script src="js/views/trazabilidad-porcina-view.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.TrazabilidadPorcinaView) {
        window.TrazabilidadPorcinaView.render("app-content");
      }
    });
  </script>
</body>
</html>
