
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Livestock Manager Premium v5.0.0 - Panel Rugged</title>
  
  <!-- Tipografía Oficial -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* VARIABLES DE MARCA - REGISTRADAS */
    :root {
      --bg-dark: #0f172a;       /* Fondo Oscuro / Slate Charcoal */
      --surface-dark: #111827;  /* Texto Principal / Ink (como fondo de panel) */
      --surface-light: #f0f1f3; /* Surface secundaria */
      --accent: #10b981;        /* AgTech Green / Grass / Esmeralda */
      --accent-muted: rgba(16, 185, 129, 0.15);
      --border-color: #d9dadd;  /* Border color */
      --text-light: #f9fafb;    /* Fondo Claro / Snow (como color de texto principal en modo oscuro) */
      --text-muted: #94a3b8;
      
      /* Colores de Alerta Industrial */
      --alert-red: #ef4444;
      --alert-red-glow: rgba(239, 68, 68, 0.4);
      --alert-yellow: #fbbf24;
      --alert-yellow-glow: rgba(251, 191, 36, 0.3);

      /* Diseño Base */
      --border-radius: 8px;
      --border-width: 1px;
      
      /* Tamaños base de interacción táctil (Modo Estándar) */
      --hit-target-height: 40px;
      --hit-target-padding: 8px 16px;
      --grid-gap: 16px;
      --font-scale-base: 14px;
    }

    /* MODO RUGGED (MODO CAMPO) - IDEAS 1 */
    .rugged-mode {
      --hit-target-height: 54px;
      --hit-target-padding: 14px 24px;
      --grid-gap: 24px;
      --font-scale-base: 16px;
    }

    /* Reset & Base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: var(--font-scale-base);
      line-height: 1.5;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: font-size 0.2s ease;
    }

    /* Cabecera Técnica */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: var(--surface-dark);
      border: var(--border-width) solid rgba(217, 218, 221, 0.15);
      border-radius: var(--border-radius);
      margin-bottom: var(--grid-gap);
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--text-light);
    }

    .brand-title span {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      background: var(--accent-muted);
      color: var(--accent);
      padding: 2px 6px;
      border: var(--border-width) solid var(--accent);
      border-radius: 4px;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Controladores e Indicadores Táctiles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--hit-target-height);
      padding: var(--hit-target-padding);
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: var(--border-radius);
      border: var(--border-width) solid rgba(217, 218, 221, 0.2);
      background-color: rgba(240, 241, 243, 0.05);
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background-color: var(--accent);
      color: var(--surface-dark);
      border-color: var(--accent);
    }

    .btn-primary:hover {
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    .btn-danger {
      background-color: var(--alert-red);
      color: var(--text-light);
      border-color: var(--alert-red);
    }

    .btn-rugged-toggle {
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .rugged-mode .btn-rugged-toggle {
      background: var(--accent);
      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--accent);
    }

    /* Layout de Cuadrícula Industrial */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--grid-gap);
      flex: 1;
    }

    @media (min-width: 920px) {
      .dashboard-grid {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    @media (min-width: 1280px) {
      .dashboard-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    /* Módulos y Tarjetas */
    .panel {
      background-color: var(--surface-dark);
      border: var(--border-width) solid rgba(217, 218, 221, 0.1);
      border-radius: var(--border-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: var(--border-width) solid rgba(217, 218, 221, 0.1);
      padding-bottom: 10px;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    /* MÓDULO 1: ALERTAS SANITARIAS CON GLOW (Idea 1) */
    .alert-card {
      background-color: rgba(239, 68, 68, 0.03);
      border: var(--border-width) solid var(--alert-red);
      border-radius: var(--border-radius);
      padding: 12px;
      position: relative;
      animation: alertPulse 2s infinite alternate;
    }

    @keyframes alertPulse {
      0% {
        box-shadow: 0 0 4px rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.6);
      }
      100% {
        box-shadow: 0 0 16px var(--alert-red-glow);
        border-color: var(--alert-red);
      }
    }

    .alert-card-warning {
      background-color: rgba(251, 191, 36, 0.02);
      border: var(--border-width) solid var(--alert-yellow);
      border-radius: var(--border-radius);
      padding: 12px;
      position: relative;
      animation: alertYellowPulse 2.5s infinite alternate;
    }

    @keyframes alertYellowPulse {
      0% {
        box-shadow: 0 0 4px rgba(251, 191, 36, 0.1);
        border-color: rgba(251, 191, 36, 0.5);
      }
      100% {
        box-shadow: 0 0 12px var(--alert-yellow-glow);
        border-color: var(--alert-yellow);
      }
    }

    .badge-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-danger {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid var(--alert-red);
    }

    .badge-warning {
      background-color: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
      border: 1px solid var(--alert-yellow);
    }

    /* MÓDULO 3: REGISTRO OFFLINE & RFID */
    .rfid-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      border: 1px solid rgba(217, 218, 221, 0.1);
      margin-bottom: 8px;
    }

    .indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-green {
      background-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: blink 1.5s infinite;
    }

    .dot-red {
      background-color: var(--alert-red);
      box-shadow: 0 0 8px var(--alert-red);
    }

    @keyframes blink {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .console-logger {
      background-color: #070b12;
      border: var(--border-width) solid rgba(217, 218, 221, 0.15);
      border-radius: 6px;
      padding: 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      color: #38bdf8; /* Azul tecnológico para logs */
      height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .console-line {
      display: flex;
      gap: 6px;
    }

    .console-time {
      color: var(--text-muted);
    }

    .sync-queue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .sync-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(217, 218, 221, 0.05);
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* MÓDULO 5: GRÁFICOS SVG LIGEROS */
    .chart-container {
      position: relative;
      width: 100%;
      height: 180px;
      background-color: rgba(255, 255, 255, 0.01);
      border-radius: 6px;
      border: 1px dashed rgba(217, 218, 221, 0.1);
      padding: 8px;
    }

    .chart-tooltip {
      position: absolute;
      background-color: var(--surface-dark);
      border: 1px solid var(--accent);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: 'IBM Plex Mono', monospace;
      pointer-events: none;
      display: none;
      z-index: 10;
    }

    .chart-legend {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Tabla de Datos de Precisión */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .data-table th, .data-table td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(217, 218, 221, 0.08);
    }

    .data-table th {
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
    }

    .data-table td {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Utilidades de Diseño */
    .flex-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .flex-space {
      justify-content: space-between;
    }

    .text-center {
      text-align: center;
    }

    .text-accent {
      color: var(--accent);
    }

    .text-danger {
      color: var(--alert-red);
    }

    /* Animación de Sincronización */
    @keyframes syncSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .syncing-icon {
      animation: syncSpin 1s linear infinite;
    }
  </style>
</head>
<body>

  <div id="root">Cargando interfaz de control táctil...</div>

  <!-- Carga de React 18 y Babel Standalone de manera Segura -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Estado del Modo Campo (Guantes)
      const [ruggedMode, setRuggedMode] = useState(false);
      
      // Estado de Conectividad e Hilos
      const [isOnline, setIsOnline] = useState(true);
      const [rfidConnected, setRfidConnected] = useState(true);
      
      // Datos de Censo
      const [ganado, setGanado] = useState([
        { id: "ES010928374615", tipo: "Ovino", raza: "Assaf", estado: "Producción", ultimaLeche: 3.2, alerta: false },
        { id: "ES010928374699", tipo: "Ovino", raza: "Lacaune", estado: "Tratamiento", ultimaLeche: 0.0, alerta: true, alertaDetalle: "Cuarentena: Amoxicilina (Retirada Leche hasta 10/07)" },
        { id: "ES010928374702", tipo: "Caprino", raza: "Murciano-Granadina", estado: "Secado", ultimaLeche: 0.0, alerta: false },
        { id: "ES010928374720", tipo: "Ovino", raza: "Assaf", estado: "Alerta Vet", ultimaLeche: 1.1, alerta: true, alertaDetalle: "Mastitis clínica: Ordeñar al final del lote" },
      ]);

      // Cola de Registros Offline
      const [offlineQueue, setOfflineQueue] = useState([]);
      const [logs, setLogs] = useState([
        { time: "23:00:02", msg: "Lector RFID sincronizado con base de datos local." },
        { time: "23:00:10", msg: "Comprobando conexión con SIGGAN de Andalucía... OK" }
      ]);

      // Gráficos Telemetría (Lácteo y Peso GMD)
      const [chartType, setChartType] = useState('leche'); // 'leche' o 'gmd'
      const [selectedDataPoint, setSelectedDataPoint] = useState(null);

      // Datos Gráficos
      const datosLeche = [
        { dia: "Lun", litros: 320 },
        { dia: "Mar", litros: 335 },
        { dia: "Mié", litros: 310 },
        { dia: "Jue", litros: 345 },
        { dia: "Vie", litros: 360 },
        { dia: "Sáb", litros: 352 },
        { dia: "Dom", litros: 365 }
      ];

      const datosPeso = [
        { dia: "Sem 1", gmd: 820 },
        { dia: "Sem 2", gmd: 840 },
        { dia: "Sem 3", gmd: 790 },
        { dia: "Sem 4", gmd: 880 },
        { dia: "Sem 5", gmd: 910 },
        { dia: "Sem 6", gmd: 895 },
        { dia: "Sem 7", gmd: 920 }
      ];

      // Sincronización de Logs
      const addLog = (msg) => {
        const time = new Date().toTimeString().split(' ')[0];
        setLogs(prev => [{ time, msg }, ...prev].slice(0, 10));
      };

      // Simular Lectura RFID (Escaneo Rápido)
      const handleSimulateScan = () => {
        if (!rfidConnected) {
          addLog("ERROR: Lector RFID desconectado.");
          return;
        }
        
        const randId = "ES010928374" + Math.floor(1000 + Math.random() * 9000);
        const nuevoAnimal = {
          id: randId,
          tipo: Math.random() > 0.3 ? "Ovino" : "Caprino",
          raza: "Assaf",
          estado: "Registrado",
          ultimaLeche: 0.0,
          alerta: Math.random() > 0.85
        };

        if (nuevoAnimal.alerta) {
          nuevoAnimal.alertaDetalle = "Alerta automática: Confirmar control de peso semanal.";
        }

        if (isOnline) {
          setGanado(prev => [nuevoAnimal, ...prev]);
          addLog(`Registro directo Online: Crotal ${randId}`);
        } else {
          setOfflineQueue(prev => [...prev, nuevoAnimal]);
          addLog(`Red Offline. Guardado en cola local: Crotal ${randId}`);
        }
      };

      // Sincronizar Cola Offline
      const handleSyncQueue = () => {
        if (offlineQueue.length === 0) return;
        addLog(`Iniciando sincronización de ${offlineQueue.length} registros...`);
        
        setTimeout(() => {
          setGanado(prev => [...offlineQueue, ...prev]);
          addLog(`Sincronización completada. ${offlineQueue.length} crotales volcados al Censo.`);
          setOfflineQueue([]);
        }, 1200);
      };

      // Cambiar Estado Red Manual
      const toggleNetwork = () => {
        const nextState = !isOnline;
        setIsOnline(nextState);
        addLog(nextState ? "Conectividad de red restablecida." : "El sistema ha entrado en modo local sin cobertura.");
      };

      return (
        <div className={ruggedMode ? "rugged-mode" : ""}>
          {/* Cabecera Técnica */}
          <header data-od-id="head-main">
            <div className="brand-title">
              <h1>Livestock Manager</h1>
              <span>v5.0.0 Industrial Premium</span>
            </div>
            
            <div className="system-status">
              {/* Botón de Modo Campo */}
              <button 
                data-od-id="btn-toggle-rugged"
                className="btn btn-rugged-toggle" 
                onClick={() => setRuggedMode(!ruggedMode)}
              >
                ⚙️ {ruggedMode ? "MODO CAMPO ACTIVO" : "MODO ESTÁNDAR"}
              </button>

              {/* Indicador de Cobertura */}
              <button 
                data-od-id="btn-toggle-network"
                className={`btn ${isOnline ? "" : "btn-danger"}`}
                onClick={toggleNetwork}
              >
                <span className={`dot ${isOnline ? "dot-green" : "dot-red"}`}></span>
                {isOnline ? "ONLINE" : "OFFLINE"}
              </button>
            </div>
          </header>

          <main className="dashboard-grid">
            
            {/* PANEL DE ALERTAS SANITARIAS (Idea 1) */}
            <section className="panel" data-od-id="panel-alertas">
              <div className="panel-header">
                <h2 className="panel-title">⚠️ Control de Alertas y Retiradas</h2>
                <span className="panel-subtitle">Cumplimiento RD 787/2023</span>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                {ganado.filter(a => a.alerta).map(animal => (
                  <div 
                    key={animal.id} 
                    className={animal.estado.includes("Tratamiento") ? "alert-card" : "alert-card-warning"}
                    data-od-id={`alert-card-${animal.id}`}
                  >
                    <div className="flex-row flex-space" style={{ marginBottom: '6px' }}>
                      <strong style={{ fontFamily: 'IBM Plex Mono', fontSize: '1rem' }}>{animal.id}</strong>
                      <span className={animal.estado.includes("Tratamiento") ? "badge-status badge-danger" : "badge-status badge-warning"}>
                        {animal.estado}
                      </span>
                    </div>
                    <p style={{ fontSize: '0.85rem', color: '#f8fafc' }}>
                      {animal.alertaDetalle}
                    </p>
                    <div style={{ marginTop: '8px', fontSize: '0.75rem', color: var(--text-muted) }}>
                      Raza: {animal.raza} | Tipo: {animal.tipo}
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* PANEL DE REGISTRO RFID Y COLA OFFLINE (Idea 3) */}
            <section className="panel" data-od-id="panel-rfid">
              <div className="panel-header">
                <h2 className="panel-title">📶 Lector de Crotales RFID</h2>
                <button 
                  className="btn" 
                  onClick={() => setRfidConnected(!rfidConnected)}
                  style={{ height: '32px', padding: '0 8px', fontSize: '0.75rem' }}
                >
                  {rfidConnected ? "Desconectar RFID" : "Conectar RFID"}
                </button>
              </div>

              <div className="rfid-status-bar">
                <span className="indicator">
                  <span className={`dot ${rfidConnected ? "dot-green" : "dot-red"}`}></span>
                  {rfidConnected ? "LECTOR RFID BLUETOOTH CONECTADO" : "SIN DISPOSITIVO RFID"}
                </span>
                <span style={{ fontFamily: 'IBM Plex Mono', fontSize: '0.8rem' }}>
                  Antena: 915 MHz
                </span>
              </div>

              <div className="flex-row flex-space" style={{ gap: '10px' }}>
                <button 
                  data-od-id="btn-simular-scan"
                  className="btn btn-primary" 
                  style={{ flex: 1 }}
                  onClick={handleSimulateScan}
                  disabled={!rfidConnected}
                >
                  📢 Simular Escaneo Crotal
                </button>
                
                {offlineQueue.length > 0 && (
                  <button 
                    data-od-id="btn-sync-queue"
                    className="btn btn-primary" 
                    style={{ flex: 1, backgroundColor: '#fbbf24', borderColor: '#fbbf24', color: '#0f172a' }}
                    onClick={handleSyncQueue}
                    disabled={!isOnline}
                  >
                    🔄 Sincronizar Cola ({offlineQueue.length})
                  </button>
                )}
              </div>

              {/* Cola de Registros Locales (Offline) */}
              <div>
                <h3 style={{ fontSize: '0.9rem', marginBottom: '8px', textTransform: 'uppercase' }}>
                  Cola de Almacenamiento Local ({offlineQueue.length})
                </h3>
                {offlineQueue.length === 0 ? (
                  <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontStyle: 'italic' }}>
                    No hay registros pendientes de sincronización.
                  </p>
                ) : (
                  <div className="sync-queue-list">
                    {offlineQueue.map((item, idx) => (
                      <div className="sync-item" key={idx}>
                        <span>{item.id}</span>
                        <span className="badge-status badge-warning">Local Offline</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* Consola Técnica en Tiempo Real */}
              <div>
                <h3 style={{ fontSize: '0.9rem', marginBottom: '8px', textTransform: 'uppercase' }}>
                  Logs de Sistema
                </h3>
                <div className="console-logger">
                  {logs.map((log, idx) => (
                    <div className="console-line" key={idx}>
                      <span className="console-time">[{log.time}]</span>
                      <span>{log.msg}</span>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* PANEL DE TELEMETRÍA GRÁFICA SVG (Idea 5) */}
            <section className="panel" data-od-id="panel-graficas" style={{ gridColumn: ruggedMode ? 'span 1' : 'auto' }}>
              <div className="panel-header">
                <h2 className="panel-title">📊 Rendimiento Telemétrico</h2>
                <div className="flex-row">
                  <button 
                    className={`btn ${chartType === 'leche' ? 'btn-primary' : ''}`}
                    style={{ height: '30px', padding: '0 8px', fontSize: '0.75rem' }}
                    onClick={() => { setChartType('leche'); setSelectedDataPoint(null); }}
                  >
                    Ordeño (Litros)
                  </button>
                  <button 
                    className={`btn ${chartType === 'gmd' ? 'btn-primary' : ''}`}
                    style={{ height: '30px', padding: '0 8px', fontSize: '0.75rem' }}
                    onClick={() => { setChartType('gmd'); setSelectedDataPoint(null); }}
                  >
                    Crecimiento (GMD)
                  </button>
                </div>
              </div>

              {/* Contenedor del Gráfico SVG Autocontenido */}
              <div className="chart-container" data-od-id="svg-chart-wrapper">
                <svg viewBox="0 0 400 160" width="100%" height="100%" style={{ overflow: 'visible' }}>
                  {/* Rejilla de fondo */}
                  <line x1="40" y1="20" x2="380" y2="20" stroke="rgba(217, 218, 221, 0.08)" strokeWidth="1" />
                  <line x1="40" y1="60" x2="380" y2="60" stroke="rgba(217, 218, 221, 0.08)" strokeWidth="1" />
                  <line x1="40" y1="100" x2="380" y2="100" stroke="rgba(217, 218, 221, 0.08)" strokeWidth="1" />
                  <line x1="40" y1="140" x2="380" y2="140" stroke="rgba(217, 218, 221, 0.2)" strokeWidth="1" />

                  {/* Ejes y Etiquetas */}
                  <text x="35" y="25" fill="#94a3b8" fontSize="8" textAnchor="end" fontFamily="IBM Plex Mono">
                    {chartType === 'leche' ? '380L' : '950g'}
                  </text>
                  <text x="35" y="80" fill="#94a3b8" fontSize="8" textAnchor="end" fontFamily="IBM Plex Mono">
                    {chartType === 'leche' ? '330L' : '850g'}
                  </text>
                  <text x="35" y="135" fill="#94a3b8" fontSize="8" textAnchor="end" fontFamily="IBM Plex Mono">
                    {chartType === 'leche' ? '280L' : '750g'}
                  </text>

                  {/* Renderizado de Datos Lácteos */}
                  {chartType === 'leche' && (
                    <g>
                      <path 
                        d={`M 50 ${140 - (datosLeche[0].litros - 280) * 1.2} 
                            L 100 ${140 - (datosLeche[1].litros - 280) * 1.2} 
                            L 150 ${140 - (datosLeche[2].litros - 280) * 1.2} 
                            L 200 ${140 - (datosLeche[3].litros - 280) * 1.2} 
                            L 250 ${140 - (datosLeche[4].litros - 280) * 1.2} 
                            L 300 ${140 - (datosLeche[5].litros - 280) * 1.2} 
                            L 350 ${140 - (datosLeche[6].litros - 280) * 1.2}`}
                        fill="none" 
                        stroke="var(--accent)" 
                        strokeWidth="3" 
                        strokeLinecap="round"
                      />
                      {datosLeche.map((d, i) => {
                        const cx = 50 + i * 50;
                        const cy = 140 - (d.litros - 280) * 1.2;
                        return (
                          <g key={i}>
                            <circle 
                              cx={cx} 
                              cy={cy} 
                              r="5" 
                              fill="var(--accent)" 
                              style={{ cursor: 'pointer' }}
                              onClick={() => setSelectedDataPoint({ label: d.dia, val: `${d.litros} Litros` })}
                            />
                            <text x={cx} y="155" fill="#94a3b8" fontSize="8" textAnchor="middle" fontFamily="IBM Plex Mono">
                              {d.dia}
                            </text>
                          </g>
                        );
                      })}
                    </g>
                  )}

                  {/* Renderizado de Datos de Ganancia de Peso (GMD) */}
                  {chartType === 'gmd' && (
                    <g>
                      <path 
                        d={`M 50 ${140 - (datosPeso[0].gmd - 700) * 0.4} 
                            L 100 ${140 - (datosPeso[1].gmd - 700) * 0.4} 
                            L 150 ${140 - (datosPeso[2].gmd - 700) * 0.4} 
                            L 200 ${140 - (datosPeso[3].gmd - 700) * 0.4} 
                            L 250 ${140 - (datosPeso[4].gmd - 700) * 0.4} 
                            L 300 ${140 - (datosPeso[5].gmd - 700) * 0.4} 
                            L 350 ${140 - (datosPeso[6].gmd - 700) * 0.4}`}
                        fill="none" 
                        stroke="#38bdf8" 
                        strokeWidth="3" 
                        strokeLinecap="round"
                      />
                      {datosPeso.map((d, i) => {
                        const cx = 50 + i * 50;
                        const cy = 140 - (d.gmd - 700) * 0.4;
                        return (
                          <g key={i}>
                            <circle 
                              cx={cx} 
                              cy={cy} 
                              r="5" 
                              fill="#38bdf8" 
                              style={{ cursor: 'pointer' }}
                              onClick={() => setSelectedDataPoint({ label: d.dia, val: `${d.gmd} g/día` })}
                            />
                            <text x={cx} y="155" fill="#94a3b8" fontSize="8" textAnchor="middle" fontFamily="IBM Plex Mono">
                              {d.dia}
                            </text>
                          </g>
                        );
                      })}
                    </g>
                  )}
                </svg>
              </div>

              <div className="flex-row flex-space" style={{ fontSize: '0.8rem', padding: '4px' }}>
                <div>
                  <strong>{chartType === 'leche' ? "Rendimiento Medio:" : "GMD Promedio Lote:"}</strong>{' '}
                  <span className="text-accent" style={{ fontFamily: 'IBM Plex Mono' }}>
                    {chartType === 'leche' ? "341.7 Litros/lote" : "865 g/día"}
                  </span>
                </div>
                {selectedDataPoint && (
                  <div style={{ background: 'rgba(255,255,255,0.05)', padding: '2px 8px', borderRadius: '4px', border: '1px solid var(--accent)' }}>
                    <strong>{selectedDataPoint.label}:</strong> <span style={{ fontFamily: 'IBM Plex Mono' }}>{selectedDataPoint.val}</span>
                  </div>
                )}
              </div>
            </section>

          </main>

          {/* Listado de Censo General */}
          <section className="panel" style={{ marginTop: var(--grid-gap) }} data-od-id="panel-censo">
            <div className="panel-header">
              <h2 className="panel-title">📋 Censo e Historial de Registros</h2>
              <span className="panel-subtitle">Total: {ganado.length} animales</span>
            </div>

            <div style={{ overflowX: 'auto' }}>
              <table className="data-table">
                <thead>
                  <tr>
                    <th>Crotal / Identificador</th>
                    <th>Tipo</th>
                    <th>Raza / Lote</th>
                    <th>Estado Crítico</th>
                    <th>Último Ordeño</th>
                  </tr>
                </thead>
                <tbody>
                  {ganado.map((animal, idx) => (
                    <tr key={idx} style={{ backgroundColor: animal.alerta ? 'rgba(239, 68, 68, 0.04)' : 'transparent' }}>
                      <td style={{ fontWeight: 'bold' }}>{animal.id}</td>
                      <td>{animal.tipo}</td>
                      <td>{animal.raza}</td>
                      <td>
                        {animal.alerta ? (
                          <span className="text-danger" style={{ fontWeight: 'bold' }}>⚠️ ALERTA RETIRADA</span>
                        ) : (
                          <span className="text-accent">Apto</span>
                        )}
                      </td>
                      <td>{animal.ultimaLeche > 0 ? `${animal.ultimaLeche} L` : '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
