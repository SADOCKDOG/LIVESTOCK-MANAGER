<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Force Reload — Livestock Manager</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Courier New', monospace;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #4ade80;
            border-bottom: 2px solid #4ade80;
            padding-bottom: 10px;
        }
        .section {
            background: #2a2a2a;
            border-left: 4px solid #4ade80;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
        button {
            background: #4ade80;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px 5px 5px 0;
        }
        button:hover {
            background: #22c55e;
        }
        button.danger {
            background: #ef4444;
            color: #fff;
        }
        button.danger:hover {
            background: #dc2626;
        }
        #output {
            background: #000;
            border: 1px solid #4ade80;
            padding: 15px;
            border-radius: 4px;
            max-height: 600px;
            overflow-y: auto;
            margin-top: 15px;
            font-size: 12px;
            line-height: 1.5;
        }
        .log-item {
            margin: 5px 0;
            padding: 5px;
        }
        .log-success { color: #4ade80; }
        .log-error { color: #ef4444; }
        .log-info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Test Force Reload — Livestock Manager</h1>
        
        <div class="section">
            <h2>1️⃣ Limpieza de Cache y Service Worker</h2>
            <p>Elimina completamente el cache y los service workers viejos.</p>
            <button class="danger" onclick="limpiarCompletamente()">🗑️ Limpiar Cache + SW</button>
            <button onclick="desregistrarSW()">📋 Desregistrar Service Workers</button>
            <button onclick="listarCaches()">📊 Listar Caches</button>
        </div>

        <div class="section">
            <h2>2️⃣ Recargar App</h2>
            <p>Después de limpiar, recarga la app desde cero.</p>
            <button onclick="recargarApp()">🔄 Recargar App (Ctrl+Shift+R)</button>
        </div>

        <div class="section">
            <h2>3️⃣ Ejecutar Tests</h2>
            <p>Ejecuta los tests SIGGAN después de recargar.</p>
            <button onclick="ejecutarTests()">🧪 Ejecutar SigganQA.runAll()</button>
            <button onclick="ejecutarTestIndividual()">🎯 Ejecutar TEST 16 (sandach)</button>
        </div>

        <div id="output"></div>
    </div>

    <script>
        const output = document.getElementById('output');

        function log(msg, type = 'info') {
            const item = document.createElement('div');
            item.className = `log-item log-${type}`;
            item.textContent = msg;
            output.appendChild(item);
            output.scrollTop = output.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${msg}`);
        }

        async function limpiarCompletamente() {
            log('🧹 Iniciando limpieza completa...', 'info');
            
            try {
                // 1. Desregistrar Service Workers
                const regs = await navigator.serviceWorker.getRegistrations();
                for (const reg of regs) {
                    await reg.unregister();
                    log(`✅ Service Worker desregistrado: ${reg.scope}`, 'success');
                }

                // 2. Limpiar caches
                const allCaches = await caches.keys();
                log(`📦 Caches encontrados: ${allCaches.join(', ')}`, 'info');
                
                for (const cacheName of allCaches) {
                    await caches.delete(cacheName);
                    log(`✅ Cache eliminado: ${cacheName}`, 'success');
                }

                // 3. Limpiar IndexedDB
                const dbs = await indexedDB.databases();
                for (const db of dbs) {
                    indexedDB.deleteDatabase(db.name);
                    log(`✅ IndexedDB eliminado: ${db.name}`, 'success');
                }

                log('✅✅✅ LIMPIEZA COMPLETADA', 'success');
                log('⚠️ PRÓXIMO PASO: Recarga la página (Ctrl+Shift+R)', 'info');
                
            } catch (e) {
                log(`❌ Error durante limpieza: ${e.message}`, 'error');
            }
        }

        async function desregistrarSW() {
            log('📋 Desregistrando Service Workers...', 'info');
            try {
                const regs = await navigator.serviceWorker.getRegistrations();
                for (const reg of regs) {
                    await reg.unregister();
                    log(`✅ Desregistrado: ${reg.scope}`, 'success');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }

        async function listarCaches() {
            log('📊 Listando caches...', 'info');
            try {
                const keys = await caches.keys();
                keys.forEach(k => log(`  • ${k}`, 'info'));
                log(`Total: ${keys.length} caches`, 'success');
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }

        function recargarApp() {
            log('🔄 Recargando página...', 'info');
            // Forzar recarga sin cache (Ctrl+Shift+R)
            window.location.href = window.location.href.split('?')[0] + '?t=' + Date.now();
        }

        async function ejecutarTests() {
            log('🧪 Iniciando SigganQA.runAll()...', 'info');
            log('⏳ Espera, esto puede tomar ~15 segundos...', 'info');
            
            // Esperar a que SigganQA cargue
            let intentos = 0;
            while (!window.SigganQA && intentos < 10) {
                await new Promise(r => setTimeout(r, 1000));
                intentos++;
            }

            if (!window.SigganQA) {
                log('❌ SigganQA no cargó. Recarga la página primero.', 'error');
                return;
            }

            try {
                await SigganQA.runAll();
                log('✅ Tests completados', 'success');
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }

        async function ejecutarTestIndividual() {
            log('🎯 Ejecutando TEST 16 (SANDACH)...', 'info');
            
            let intentos = 0;
            while (!window.SigganQA && intentos < 10) {
                await new Promise(r => setTimeout(r, 1000));
                intentos++;
            }

            if (!window.SigganQA) {
                log('❌ SigganQA no cargó. Recarga la página primero.', 'error');
                return;
            }

            try {
                const result = await SigganQA.run('sandach');
                log(`✅ TEST 16 completado: ${result ? 'PASS' : 'FAIL'}`, result ? 'success' : 'error');
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
            }
        }

        // Auto-log inicial
        window.addEventListener('load', () => {
            log('✅ Página cargada', 'success');
            log('📍 Service Workers activos:', 'info');
            navigator.serviceWorker.getRegistrations().then(regs => {
                if (regs.length === 0) {
                    log('  (ninguno)', 'info');
                } else {
                    regs.forEach(r => log(`  • ${r.scope}`, 'info'));
                }
            });
        });
    </script>
</body>
</html>
